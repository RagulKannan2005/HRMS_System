<input type="text" name="" id="" placeholder="Search by name" [(ngModel)]="searchname">
<input type="text" placeholder="Search by department" [(ngModel)]="searchdepartment">
<input type="text" placeholder="Search by minimum salary" [(ngModel)]="searchminsalary">
<button style="padding: 5px;margin-left: 10px;border-radius: 5px;border: none;"
    (click)="filteremployees()">search</button>
<table border="1" cellpadding="10" style="margin-top: 50px;">
    <thead>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>department</th>
            <th>salary</th>
        </tr>
    </thead>
    <tbody>
        @for(emp of filteremployee; track emp.id){
        <tr>
            <td>{{emp.id}}</td>
            <td>{{emp.name}}</td>
            <td>{{emp.department}}</td>
            <td>{{emp.salary}}</td>
            <!-- <td><button (click)="onEdit(emp.id)">Edit</button><button (click)="onDelete(emp.id)">Delete</button></td> -->
        </tr>
        }@empty{
        <tr>
            <td colspan="4">No employee found</td>
        </tr>
        }
    </tbody>
</table>
