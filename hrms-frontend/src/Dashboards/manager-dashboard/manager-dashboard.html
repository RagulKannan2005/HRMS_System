<div class="contianer">
  <aside class="sidebar">
    <div class="logo-container">
      <div class="logo-text">
        <h3>HRMS</h3>
      </div>
      <div class="logo-subtitle">
        <span>Manager Portal</span>
      </div>
    </div>

    <div class="user-badge">
      <div class="user-avatar">{{ username.charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <span class="user-name">{{ username }}</span>
        <span class="user-role">MANAGER</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">TEAM MANAGEMENT</div>

      <div
        class="nav-links"
        routerLink="/manager/manager-home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="icon"><img src="assets/icons/dashboard (1).png" alt="Dashboard" /></span>
        <span class="text">Dashboard</span>
      </div>

      <div class="nav-links" routerLink="/manager/team" routerLinkActive="active">
        <span class="icon"><img src="assets/icons/community.png" alt="My Team" /></span>
        <span class="text">My Team</span>
      </div>

      <div class="nav-links" routerLink="/manager/leave-approvals" routerLinkActive="active">
        <span class="icon"><img src="assets/icons/work.png" alt="Leave Approvals" /></span>
        <span class="text">Leave Approvals</span>
      </div>

      <div class="nav-links" routerLink="/manager/attendance" routerLinkActive="active">
        <span class="icon"><img src="assets/icons/machine.png" alt="Attendance" /></span>
        <span class="text">Attendance</span>
      </div>

      <div class="nav-links" routerLink="/manager/payroll" routerLinkActive="active">
        <span class="icon"><img src="assets/icons/sponsor.png" alt="Payroll" /></span>
        <span class="text">Payroll</span>
      </div>

      <div class="nav-section-title" style="margin-top: 15px;">SELF-SERVICE</div>

      <div class="nav-links" routerLink="/manager/my-portal" routerLinkActive="active">
        <span class="icon"><img src="assets/icons/layers.png" alt="My Portal" /></span>
        <span class="text">My Self-Service</span>
      </div>

      <div class="nav-links logout-link" (click)="onLogout()">
        <span class="icon"><img src="assets/icons/power-off.png" alt="Logout" /></span>
        <span class="text">Logout</span>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
